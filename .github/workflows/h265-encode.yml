name: H265 encode

# Videoni FAQAT H.265 (libx265) bilan qayta kodlaydi.
# Videoga hech qanday logotip ham, cover-rasm (intro) ham qo'shilmaydi.
# Bitrate: o'rtacha 1500k | minimal 800k | maksimal 2000k | buffer 2500k

on:
  workflow_dispatch: {}

concurrency:
  group: h265-encode
  cancel-in-progress: false

jobs:
  encode-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r scripts/requirements.txt

      - name: Restore Telegram session
        run: |
          if [ -z "${{ secrets.PYRO_SESSION_B64_1 }}" ]; then
            echo "::error::PYRO_SESSION_B64_1/2/3 sekretlari topilmadi"
            exit 1
          fi
          printf '%s%s%s' "${{ secrets.PYRO_SESSION_B64_1 }}" "${{ secrets.PYRO_SESSION_B64_2 }}" "${{ secrets.PYRO_SESSION_B64_3 }}" | base64 -d > "$GITHUB_WORKSPACE/scripts/pyro_session.session"

      - name: R2'dan papkalarni birin-ketin yuklab olib H.265 bilan kodlash va Telegramga yuklash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: anime
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
          PYTHONUNBUFFERED: "1"
        run: bash scripts/process_all_h265.sh

      - name: Remove Telegram session from disk
        if: always()
        run: rm -f scripts/pyro_session.session
