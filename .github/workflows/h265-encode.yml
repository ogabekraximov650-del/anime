name: H265 encode

# Videoni FAQAT H.265 (libx265) bilan qayta kodlaydi.
# Videoga hech qanday logotip ham, cover-rasm (intro) ham qo'shilmaydi.
# Bitrate chegaralari YO'Q — CRF rejimi, maqsad fayl hajmini kichik qilish.
#
# Manba: R2'dagi "aniraxuz" bucket.
# Manbaning sifatiga qarab bir nechta sifat tayyorlanadi (upscale qilinmaydi):
#   1080p -> 1080p, 720p, 480p, 360p      480p -> 480p, 360p
#    720p ->        720p, 480p, 360p      360p -> faqat 360p
# Har sifat AYNAN BIR XIL asl manbadan chiqariladi, shuning uchun barcha
# sifatning davomiyligi bir xil bo'ladi.
#
# Natija: akkountning o'zining Saqlangan xabarlari (Saved Messages).
# Video tagidagi sarlavha — bucketdagi papka nomi va sifat.
#
# RESUME: har sifat Telegramga to'liq yuborilgach, R2'dagi shu papkaga
# "<sifat>.md" marker fayli yuklanadi. Actions limiti tugab ish o'chib qolsa,
# qayta ishga tushirilganda marker fayli bor sifatlar o'tkazib yuboriladi —
# faqat qolganlari tayyorlanadi. Hamma sifat tugagach papka R2'dan
# butunlay o'chiriladi.
#
# Bitta papka tugagach bucket ro'yxati QAYTADAN o'qiladi, shuning uchun
# workflow ishlayotganda yuklangan yangi papkalar ham shu run'da ishlanadi.

on:
  workflow_dispatch: {}

concurrency:
  group: h265-encode
  cancel-in-progress: false

jobs:
  encode-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r scripts/requirements.txt

      - name: Restore Telegram session
        run: |
          if [ -z "${{ secrets.PYRO_SESSION_B64_1 }}" ]; then
            echo "::error::PYRO_SESSION_B64_1/2/3 sekretlari topilmadi"
            exit 1
          fi
          printf '%s%s%s' "${{ secrets.PYRO_SESSION_B64_1 }}" "${{ secrets.PYRO_SESSION_B64_2 }}" "${{ secrets.PYRO_SESSION_B64_3 }}" | base64 -d > "$GITHUB_WORKSPACE/scripts/pyro_session.session"

      - name: aniraxuz bucket'dan yuklab olib H.265 ko'p sifatda kodlash va Saqlangan xabarlarga yuborish
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: aniraxuz
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          # "me" = akkountning o'zining Saqlangan xabarlari
          TG_TARGET: me
          # CRF BASE qiymati (1080p uchun). Past sifatlar avtomatik
          # BASE-1 / BASE-2 / BASE-3 oladi. Fayl hajmini yana kichraytirish
          # uchun oshirish mumkin (32, 34) — sifat shunga yarasha pasayadi.
          H265_CRF: "30"
          H265_PRESET: medium
          # Papkadagi eng yangi fayl shu daqiqadan yosh bo'lsa, papka bu
          # aylanishda o'tkazib yuboriladi (hali telefondan yuklanmoqda
          # bo'lishi mumkin). 0 — tekshiruvni o'chiradi.
          R2_SETTLE_MIN: "2"
          PYTHONUNBUFFERED: "1"
        run: bash scripts/process_all_h265.sh

      - name: Remove Telegram session from disk
        if: always()
        run: rm -f scripts/pyro_session.session
