name: Audio Check

# VAQTINCHALIK DIAGNOSTIKA workflow'i — Telegramdagi tayyor videolarni
# yuklab olib, audiosidagi shovqinni o'lchaydi va natijani log'ga bosadi.
# Tekshiruv tugagach bu faylni o'chirib tashlash mumkin.

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: "Chat ID (masalan -1003709920873)"
        required: true
        default: "-1003709920873"
      message_ids:
        description: "Xabar raqamlari, probel bilan (masalan: 17 19)"
        required: true
        default: "17 19"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r scripts/requirements.txt

      - name: Restore Telegram session
        run: |
          if [ -z "${{ secrets.PYRO_SESSION_B64_1 }}" ]; then
            echo "::error::PYRO_SESSION_B64_1/2/3 sekretlari topilmadi"
            exit 1
          fi
          printf '%s%s%s' "${{ secrets.PYRO_SESSION_B64_1 }}" "${{ secrets.PYRO_SESSION_B64_2 }}" "${{ secrets.PYRO_SESSION_B64_3 }}" | base64 -d > "$GITHUB_WORKSPACE/scripts/pyro_session.session"

      - name: Videolarni yuklab olib audiosini o'lchash
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          PYTHONUNBUFFERED: "1"
        run: python3 -u scripts/audio_check.py ${{ inputs.chat_id }} ${{ inputs.message_ids }}

      - name: Remove Telegram session from disk
        if: always()
        run: rm -f scripts/pyro_session.session
