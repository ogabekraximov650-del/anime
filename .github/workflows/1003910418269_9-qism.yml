name: Encode 1003910418269_9-qism

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: encode-1003910418269_9-qism
  cancel-in-progress: false

jobs:
  encode-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r scripts/requirements.txt

      - name: Restore Telegram session
        run: |
          if [ -z "${{ secrets.PYRO_SESSION_B64_1 }}" ]; then
            echo "::error::PYRO_SESSION_B64_1/2/3 sekretlari topilmadi"
            exit 1
          fi
          printf '%s%s%s' "${{ secrets.PYRO_SESSION_B64_1 }}" "${{ secrets.PYRO_SESSION_B64_2 }}" "${{ secrets.PYRO_SESSION_B64_3 }}" | base64 -d > "$GITHUB_WORKSPACE/scripts/pyro_session.session"

      - name: Encode episode
        run: bash scripts/encode.sh "1003910418269_9-qism"

      - name: Upload to Telegram and send link
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          PYTHONUNBUFFERED: "1"
        run: |
          FOLDER="1003910418269_9-qism"
          CHAT_ID="${FOLDER%%_*}"
          NAME="${FOLDER#*_}"
          LOGO=$(ls anipng/*_logo.png 2>/dev/null | head -n 1)
          if [ -n "$LOGO" ]; then
            USER_ID=$(basename "$LOGO" | sed 's/_logo\.png$//')
          else
            USER_ID=""
          fi
          echo "Kanal: $CHAT_ID | User: $USER_ID | Nom: $NAME"
          python3 -u scripts/telegram_upload.py "${NAME}.mp4" \
            --chat "$CHAT_ID" --user "$USER_ID" --name "$NAME"

      - name: Remove Telegram session from disk
        if: always()
        run: rm -f scripts/pyro_session.session

      - name: Cleanup processed source files and this workflow
        if: success()
        run: |
          FOLDER="1003910418269_9-qism"
          NAME="${FOLDER#*_}"
          rm -rf "anime/$FOLDER"
          rm -f "anipng/${FOLDER}.png"
          rm -f anipng/*_"${NAME}".png
          rm -f "${NAME}.mp4"
          rm -f ".github/workflows/1003910418269_9-qism.yml"

      - name: Commit cleanup
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: 1003910418269_9-qism yuklandi va tozalandi [skip encode]"
            git push
          else
            echo "Tozalanadigan narsa topilmadi."
          fi
