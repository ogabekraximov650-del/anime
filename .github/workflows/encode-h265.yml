name: Encode (H265)

# "Encode" workflow'i bilan AYNAN BIR XIL (o'sha "anime" bucket, cover-intro,
# logotip, Telegram chati) — faqat video H.265 (libx265) bilan kodlanadi.
# Ikkalasi bir xil bucket'ni ishlagani uchun bitta concurrency guruhida —
# bir vaqtda ishga tushirilsa navbat bilan bajariladi.

on:
  workflow_dispatch: {}

concurrency:
  group: encode
  cancel-in-progress: false

jobs:
  encode-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r scripts/requirements.txt

      - name: Restore Telegram session
        run: |
          if [ -z "${{ secrets.PYRO_SESSION_B64_1 }}" ]; then
            echo "::error::PYRO_SESSION_B64_1/2/3 sekretlari topilmadi"
            exit 1
          fi
          printf '%s%s%s' "${{ secrets.PYRO_SESSION_B64_1 }}" "${{ secrets.PYRO_SESSION_B64_2 }}" "${{ secrets.PYRO_SESSION_B64_3 }}" | base64 -d > "$GITHUB_WORKSPACE/scripts/pyro_session.session"

      - name: R2'dan papkalarni birin-ketin yuklab olib kodlash va Telegramga yuklash (H.265)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: anime
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          VIDEO_CODEC: h265
          # CRF BASE (1080p uchun), "H265 encode" bilan bir xil. Past sifatlar
          # avtomatik BASE-1 / BASE-2 / BASE-3 oladi. Katta qiymat = kichik fayl.
          H265_CRF: "30"
          H265_PRESET: medium
          PYTHONUNBUFFERED: "1"
        run: bash scripts/process_all.sh

      - name: Remove Telegram session from disk
        if: always()
        run: rm -f scripts/pyro_session.session
