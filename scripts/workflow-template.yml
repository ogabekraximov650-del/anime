name: Encode __FOLDER__

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: encode-__FOLDER__
  cancel-in-progress: false

jobs:
  encode-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r scripts/requirements.txt

      - name: Restore Telegram session
        run: |
          if [ -z "${{ secrets.PYRO_SESSION_B64_1 }}" ]; then
            echo "::error::PYRO_SESSION_B64_1/2/3 sekretlari o'rnatilmagan (repo Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          printf '%s%s%s' "${{ secrets.PYRO_SESSION_B64_1 }}" "${{ secrets.PYRO_SESSION_B64_2 }}" "${{ secrets.PYRO_SESSION_B64_3 }}" | base64 -d > "$GITHUB_WORKSPACE/scripts/pyro_session.session"

      - name: Encode episode
        run: bash scripts/encode.sh "__FOLDER__"

      - name: Upload finished video to Telegram
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python3 -u scripts/telegram_upload.py "Final___FOLDER___H264.mp4"

      - name: Remove Telegram session from disk
        if: always()
        run: rm -f scripts/pyro_session.session

      - name: Cleanup processed source files and this workflow
        if: success()
        run: |
          rm -rf "anime/__FOLDER__" "anipng/__FOLDER__.png" "Final___FOLDER___H264.mp4"
          rm -f ".github/workflows/__FOLDER__.yml"

      - name: Commit cleanup
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: __FOLDER__ yuklandi va tozalandi [skip encode]"
            git push
          else
            echo "Tozalanadigan narsa yo'q."
          fi
